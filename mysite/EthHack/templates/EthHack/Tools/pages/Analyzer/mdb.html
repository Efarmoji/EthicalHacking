{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'EthHack/css/tools/util.css' %}">

<body>
    <h1>mdb-table</h1>
    <div class="code-box"><pre><code>mdb-table xx.mdb</code></pre></div>
    <ul><li>A command that lists all the tables contained in a Microsoft Access database.</li></ul>

    <h1>mdb-export</h1>
    <div class="code-box"><pre><code>mdb-export xx.mdb TABLE_NAME</code></pre></div>
    <ul><li>A command that exports a specific table from a Microsoft Access database to CSV or SQL format.</li></ul>
</body>
</html>
